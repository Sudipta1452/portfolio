<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume for Sudipta</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body class="is-preload">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Invite/recovery emails link here with a #token in the URL. The
      // widget script above detects that token and opens the set-password
      // modal automatically; once logged in, send the user to the CMS.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/'
            })
          }
        })
      }
    </script>
  </body>
</html>
